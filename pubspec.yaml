name: growth_gauge
version: 1.1.3+1
publish_to: none
environment:
  sdk: ">=3.4.1 <4.0.0"
description: An application to keep the count of the tasks or activities.
dependencies:
  clock: ^1.1.2
  collection: ^1.19.1
  csv: ^8.0.0
  cupertino_icons: ^1.0.6
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_heatmap_calendar: ^1.0.5
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  local_auth: ^3.0.2
  lottie: ^3.3.1
  page_transition: ^2.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.28
  timezone: ^0.11.1
  uuid: ^4.5.1
  # New Fitness Architecture Core Stack
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  drift: ^2.24.2
  drift_flutter: ^0.2.4
dev_dependencies:
  build_runner: ^2.4.15
  build_test: any
  drift_dev: ^2.24.2
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  import_sorter: 4.6.0
  json_serializable: ^6.9.5
  lint: ^2.8.0
  mockito: ^5.4.6
  pubspec_dependency_sorter: ^1.0.5
flutter:
  uses-material-design: true
  fonts:
    - family: Cera
      fonts:
        - asset: assets/fonts/CeraPro.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: OpenSans.ttf
      fonts:
        - asset: assets/fonts/OpenSans.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
import_sorter:
  comments: false
