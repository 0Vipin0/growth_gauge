name: Build and Release Growth Gauge

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the release (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.8"
          channel: "stable"
          cache: true

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libglib2.0-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup JDK
        uses: actions/setup-java@v6.3.0
        if: matrix.os == 'ubuntu-latest'
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Download Keystore for Android
        id: android_keystore
        uses: timheuer/base64-to-file@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties for Android build
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        shell: bash

      - name: Build Linux Release
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/build.sh linux --release

      - name: Build Android Release
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/build.sh apk --release
      
      - name: Build Windows Release
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File ./scripts/build.ps1 windows --release

      - name: Copy and Package Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp -rp build/app/outputs/apk/release/*.apk android_release.apk
          cd build/linux/x64/release/bundle
          zip -r ../../../../../linux_release.zip .
        shell: bash

      - name: Copy and Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows_release.zip
        shell: pwsh

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.os }}-release
          path: |
            linux_release.zip
            windows_release.zip
            android_release.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Set release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: |
            artifacts/ubuntu-latest-release/linux_release.zip
            artifacts/windows-latest-release/windows_release.zip
            artifacts/ubuntu-latest-release/android_release.apk
          draft: false
          prerelease: false